spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          writetimeout: 5000
          debug: true
          max:
            connections: 10
            connections.per.host: 10   # 계층 구조로 수정
    auth-code-expiration-millis: ${AUTH_CODE_EXPIRATION_MILLIS:600000} # 기본값 600000 (10분)

service:
  user:
    url: http://192.168.0.143:32450/user
  startup:
    url: http://192.168.0.143:32450/startup
  wallet:
    url: http://192.168.0.143:32450/wallet
