spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  logging:
    level:
      org.flywaydb: DEBUG

server:
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

# Binance Smart Chain (BSC) Network URL
bsc:
  network:
    url: https://data-seed-prebsc-1-s1.binance.org:8545/

wallet:
  keystore:
    directory: ${user.home}/keystore

contract:
  token:
    address: ${CONTRACT_TOKEN_ADDRESS}
  funding:
    address: ${CONTRACT_FUNDING_ADDRESS}
  admin:
    private-key: ${CONTRACT_ADMIN_PRIVATEKEY}
